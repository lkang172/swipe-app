# App identity lives here only: PRODUCT_BUNDLE_IDENTIFIER, APP_DISPLAY_NAME, MARKETING_VERSION.
# ${APPLE_TEAM_ID}, ${APP_PROFILE_NAME} and ${BUILD_NUMBER} are expanded by XcodeGen from the CI environment.
name: Sift
options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"

targets:
  Sift:
    type: application
    platform: iOS
    sources:
      - path: Sift
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucaskang.sift
        APP_DISPLAY_NAME: Sift
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "${APP_PROFILE_NAME}"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  Sift:
    build:
      targets:
        Sift: all
    run:
      config: Debug
    archive:
      config: Release
