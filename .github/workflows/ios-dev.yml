name: iOS dev build
on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

jobs:
  dev:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGN_IDENTITY: Apple Development
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          [ "$MAJOR" -ge 26 ] || { echo "::error::Xcode $MAJOR is below 26."; exit 1; }

      - name: Check secrets are present
        env:
          S1: ${{ secrets.IOS_P12_BASE64 }}
          S2: ${{ secrets.IOS_P12_PASSWORD }}
          S3: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          S4: ${{ secrets.APPLE_TEAM_ID }}
          S5: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0; i=0
          for name in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROFILE_APP_BASE64 APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            i=$((i+1)); var="S$i"
            [ -n "${!var}" ] || { echo "::error::secret $name is empty"; missing=1; }
          done
          exit $missing

      - name: Read app identity from project.yml
        run: |
          BUNDLE_ID=$(sed -n 's/^ *PRODUCT_BUNDLE_IDENTIFIER: *//p' project.yml)
          [ -n "$BUNDLE_ID" ] || { echo "::error::could not read project.yml"; exit 1; }
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "$BUNDLE_ID"

      - name: Import signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          printf '%s' "$P12_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Development" || {
            echo "::error::IOS_P12_BASE64 has no Apple Development identity."
            security find-identity -v -p codesigning "$KC"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          OUT=~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          printf '%s' "$PROFILE_APP" | tr -d ' \n\r\t' | base64 -d > "$OUT" || {
            echo "::error::IOS_PROFILE_APP_BASE64 is not valid base64; re-paste as ONE line."; exit 1; }
          PLIST=$(security cms -D -i "$OUT") || {
            echo "::error::IOS_PROFILE_APP_BASE64 is not a provisioning profile."; exit 1; }
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< "$PLIST")
          case "$APPID" in *".$BUNDLE_ID") ;; *) echo "::error::profile is for $APPID, expected *.$BUNDLE_ID"; exit 1 ;; esac
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /dev/stdin <<< "$PLIST" >/dev/null 2>&1 || {
            echo "::error::profile lists no devices: IOS_PROFILE_APP_BASE64 holds an App Store profile, not a Development one."; exit 1; }
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")
          echo "APP_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME"

      - name: Generate Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Show signing inputs
        run: |
          grep -nE 'CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CURRENT_PROJECT_VERSION' Sift.xcodeproj/project.pbxproj || true
          security find-identity -v -p codesigning || true
          xcodebuild -project Sift.xcodeproj -target Sift -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|TARGETED_DEVICE_FAMILY|PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION' || true

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Sift.xcodeproj -scheme Sift -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Sift.xcarchive" \
            archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::xcodebuild errors"
              grep -E "(error|fatal error):" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -80
              echo "::endgroup::"
              echo "::group::last 60 lines"; tail -60 "$RUNNER_TEMP/xcodebuild.log"; echo "::endgroup::"
              exit 65; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-dev-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>debugging</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$APP_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sift.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v7
        with:
          name: sift-dev-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
