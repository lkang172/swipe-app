name: iOS App Store release
on:
  workflow_dispatch:
  push:
    tags: ["appstore-v*"]

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          [ "$MAJOR" -ge 26 ] || { echo "::error::Xcode $MAJOR is below 26, which App Store Connect rejects."; exit 1; }

      - name: Check secrets are present
        env:
          S1: ${{ secrets.IOS_DIST_P12_BASE64 }}
          S2: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          S3: ${{ secrets.IOS_DIST_PROFILE_APP_BASE64 }}
          S4: ${{ secrets.ASC_KEY_ID }}
          S5: ${{ secrets.ASC_ISSUER_ID }}
          S6: ${{ secrets.ASC_KEY_P8_BASE64 }}
          S7: ${{ secrets.APPLE_TEAM_ID }}
          S8: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0; i=0
          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_DIST_PROFILE_APP_BASE64 \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            i=$((i+1)); var="S$i"
            [ -n "${!var}" ] || { echo "::error::secret $name is empty"; missing=1; }
          done
          exit $missing

      - name: Read app identity from project.yml
        run: |
          BUNDLE_ID=$(sed -n 's/^ *PRODUCT_BUNDLE_IDENTIFIER: *//p' project.yml)
          APP_VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          [ -n "$BUNDLE_ID" ] && [ -n "$APP_VERSION" ] || { echo "::error::could not read project.yml"; exit 1; }
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_ENV"
          echo "$BUNDLE_ID $APP_VERSION"

      - name: Import signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_DIST_PROFILE_APP_BASE64 }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          printf '%s' "$P12_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" || {
            echo "::error::IOS_DIST_P12_BASE64 has no Apple Distribution identity."
            security find-identity -v -p codesigning "$KC"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          OUT=~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          printf '%s' "$PROFILE_APP" | tr -d ' \n\r\t' | base64 -d > "$OUT" || {
            echo "::error::IOS_DIST_PROFILE_APP_BASE64 is not valid base64; re-paste as ONE line."; exit 1; }
          PLIST=$(security cms -D -i "$OUT") || {
            echo "::error::IOS_DIST_PROFILE_APP_BASE64 is not a provisioning profile."; exit 1; }
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< "$PLIST")
          case "$APPID" in *".$BUNDLE_ID") ;; *) echo "::error::profile is for $APPID, expected *.$BUNDLE_ID"; exit 1 ;; esac
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /dev/stdin <<< "$PLIST" >/dev/null 2>&1; then
            echo "::error::profile lists devices: it is Development/Ad Hoc, not App Store."; exit 1; fi
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")
          echo "APP_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME"

      - name: Generate Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Show signing inputs
        run: |
          grep -nE 'CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CURRENT_PROJECT_VERSION' SwipeApp.xcodeproj/project.pbxproj || true
          security find-identity -v -p codesigning || true
          xcodebuild -project SwipeApp.xcodeproj -target SwipeApp -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|TARGETED_DEVICE_FAMILY|PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION' || true

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project SwipeApp.xcodeproj -scheme SwipeApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SwipeApp.xcarchive" \
            archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::xcodebuild errors"
              grep -E "(error|fatal error):" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -80
              echo "::endgroup::"
              echo "::group::last 60 lines"; tail -60 "$RUNNER_TEMP/xcodebuild.log"; echo "::endgroup::"
              exit 65; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-release-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$APP_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SwipeApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \n\r\t' | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          grep -q "BEGIN PRIVATE KEY" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 || {
            echo "::error::ASC_KEY_P8_BASE64 did not decode to a .p8 key."; exit 1; }
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $APP_VERSION ($BUILD_NUMBER); appears in TestFlight after processing."

      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect
