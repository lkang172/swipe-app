name: iOS compile check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: UNSIGNED
      APP_PROFILE_NAME: UNSIGNED
      BUILD_NUMBER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          [ "$MAJOR" -ge 26 ] || { echo "::error::Xcode $MAJOR is below 26, which App Store Connect rejects."; exit 1; }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          grep -nE 'DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CURRENT_PROJECT_VERSION' SwipeApp.xcodeproj/project.pbxproj
          if grep -n '\${' SwipeApp.xcodeproj/project.pbxproj; then
            echo "::error::XcodeGen left a literal \${...} in the project."; exit 1; fi

      - name: Check altool
        run: xcrun altool --help 2>&1 | head -20 || true

      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SwipeApp.xcodeproj -scheme SwipeApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              echo "::group::xcodebuild errors"
              grep -E "(error|fatal error):" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -80
              echo "::endgroup::"
              echo "::group::last 60 lines"; tail -60 "$RUNNER_TEMP/xcodebuild.log"; echo "::endgroup::"
              exit 65; }
          grep -E "warning:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-check-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
